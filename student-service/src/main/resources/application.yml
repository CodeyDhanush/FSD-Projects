# ============================================================
# Student Service - Application Configuration
# ============================================================
# Default port is 8081.
# To run a second instance on port 8082, override at startup:
#   java -jar student-service.jar --server.port=8082
# ============================================================

spring:
  application:
    name: student-service   # Service name used for identification

server:
  port: 8081                # Default port for Instance 1
